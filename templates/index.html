<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Drowsiness Detection & Warning System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">

<header>
  <div class="brand">
    <span class="dot" id="liveDot"></span>
    <h1>Drowsiness Detection & Warning System</h1>
  </div>
</header>

<main>
  <div class="video-col" id="videoCol">
    <div class="panel video-panel" id="videoPanel">
      <span class="video-tag" id="fpsTag">CAM OFF</span>
      <div class="video-placeholder" id="placeholder">
        Start monitoring by clicking the camera button below
      </div>
      <video id="video" autoplay playsinline muted style="display:none;"></video>
      <canvas class="overlay" id="overlay" style="display:none;"></canvas>
    </div>

    <div class="icon-controls">
      <button class="icon-btn primary" id="startBtn" title="Nyalakan Kamera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        Start
      </button>
      <button class="icon-btn danger-outline" id="stopBtn" title="Matikan Kamera" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22"></path>
          <path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l1.5-2.25"></path>
          <path d="M9.5 4h5l2 3h4a2 2 0 0 1 2 2v9.34"></path>
          <path d="M14.121 15.121A3 3 0 1 1 9.88 10.88"></path>
        </svg>
        Stop
      </button>
      <button class="icon-btn" id="resetBtn" title="Reset Counter" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Reset
      </button>
    </div>
  </div>

  <div class="side">
    <div class="panel status-panel" id="statusPanel">
      <div class="gauge">
        <svg width="148" height="148" viewBox="0 0 148 148">
          <circle class="track" cx="74" cy="74" r="64"></circle>
          <circle class="fill" id="gaugeFill" cx="74" cy="74" r="64"
                   stroke-dasharray="402" stroke-dashoffset="402"></circle>
        </svg>
        <div class="gauge-label">
          <div class="gauge-count" id="countLabel">0</div>
          <div class="gauge-total" id="gaugeTotal">/ 6</div>
        </div>
      </div>
      <div class="status-label idle" id="statusLabel" style="display:none;"></div>
      <div class="alarm-banner" id="alarmBanner"></div>
    </div>

    <div class="panel log-panel" id="logPanel">
      <h2>History</h2>
      <div class="log-list" id="logList"></div>
    </div>
  </div>
</main>

</div>

<audio id="alarmAudio" src="{{ url_for('static', filename='alarm.wav') }}" loop preload="auto"></audio>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
